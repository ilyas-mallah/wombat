model:
  d_model: 192
  attention_heads: 6
  prelude_blocks: 0
  recurrent_blocks: 1
  mlp_width: 768
  latent_tokens: 32
  max_residual_update: 0.25
  use_update_gate: true

# H0 is deliberately only raw position/state embeddings. One application of
# the shared recurrent block is required before board information can reach
# the global readout token. No iteration identity is supplied.
