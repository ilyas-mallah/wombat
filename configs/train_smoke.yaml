schema: wombat.train-config.v1
seed: 0
effective_batch_size: 128
learning_rate: 0.0003
value_loss_weight: 0.25
reasoning_length_distribution:
  kind: curriculum_log_uniform
  initial_max: 8
  final_max: 64
  include_every_integer: true
max_examples: 10000
early_auxiliary_weight: 0.1
improvement_weight: 0.1
improvement_margin: 0.01
improvement_fraction: 0.1
improvement_eligibility_epsilon: 0.001
max_residual_update: 0.25
reset_recurrent_to_identity: true
policy_temperature: 0.75
move_value_weight: 0.25
continuation_weight: 0.25
