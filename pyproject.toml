[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "wombat-chess"
version = "0.1.0"
description = "Research chess engine: one weight-tied recurrent transformer that thinks for a chosen number of steps"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
authors = [{ name = "Ilyas Mallah", email = "hello@ilyasm.dev" }]
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "numpy>=2.0",
  "psutil>=6.0",
  "python-chess>=1.999",
  "PyYAML>=6.0",
  "torch>=2.7",
  "tqdm>=4.67",
  "zstandard>=0.23",
]

[project.optional-dependencies]
dev = ["pytest>=8.3"]

[project.scripts]
wombat = "wombat.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]

